<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #D97706;
      --primary-dark: #B45309;
      --primary-light: #FCD34D;
      --primary-lighter: #FEF3C7;
      --bg-gradient-start: #FFFBEB;
      --bg-gradient-end: #FEF3C7;
      --surface: rgba(255, 255, 255, 0.85);
      --surface-solid: #FFFBEB;
      --text-primary: #000000;
      --text-secondary: #525252;
      --text-light: #A3A3A3;
      --success: #059669;
      --success-light: #D1FAE5;
      --danger: #DC2626;
      --danger-light: #FEE2E2;
      --priority-high: #DC2626;
      --priority-high-bg: #FEE2E2;
      --priority-medium: #D97706;
      --priority-medium-bg: #FEF3C7;
      --priority-low: #059669;
      --priority-low-bg: #D1FAE5;
      --shadow: rgba(217, 119, 6, 0.08);
      --shadow-lg: rgba(217, 119, 6, 0.12);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(217, 119, 6, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 85% 85%, rgba(252, 211, 77, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      max-width: 520px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 2.5rem;
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      flex: 1;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 20px var(--shadow);
      transition: transform 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
    }

    .stat-number {
      font-family: 'Instrument Serif', serif;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1;
    }

    .stat-number.pending {
      color: var(--primary);
    }

    .stat-number.done {
      color: var(--success);
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 4px;
      font-weight: 600;
    }

    .input-section {
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px var(--shadow);
    }

    .input-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .task-input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
      background: var(--surface-solid);
      color: var(--text-primary);
      transition: all 0.2s ease;
      outline: none;
    }

    .task-input::placeholder {
      color: var(--text-light);
    }

    .task-input:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 4px rgba(252, 211, 77, 0.2);
    }

    .task-input.shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .priority-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .add-options-row {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-top: 8px;
      justify-content: space-between;
    }

    @media (max-width: 480px) {
      .add-options-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .edit-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .edit-confirm-btn {
        margin-left: 0;
        width: 100%;
      }
    }

    .priority-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-right: 4px;
    }

    .priority-btn {
      padding: 8px 16px;
      border: 2px solid transparent;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--surface-solid);
    }

    .priority-btn.high {
      color: var(--priority-high);
      border-color: var(--priority-high);
    }
    .priority-btn.high:hover, .priority-btn.high.active {
      background: var(--priority-high-bg);
    }

    .priority-btn.medium {
      color: var(--priority-medium);
      border-color: var(--priority-medium);
    }
    .priority-btn.medium:hover, .priority-btn.medium.active {
      background: var(--priority-medium-bg);
    }

    .priority-btn.low {
      color: var(--priority-low);
      border-color: var(--priority-low);
    }
    .priority-btn.low:hover, .priority-btn.low.active {
      background: var(--priority-low-bg);
    }

    .priority-btn.active {
      box-shadow: 0 2px 8px var(--shadow);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .add-btn {
      flex: 1;
      padding: 14px 24px;
      background: var(--text-primary);
      color: var(--bg-gradient-end);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px var(--shadow);
    }

    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--shadow-lg);
    }

    .add-btn:active {
      transform: translateY(0);
    }

    .clear-btn {
      padding: 14px 20px;
      background: var(--danger-light);
      color: var(--danger);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .clear-btn:hover {
      background: var(--danger);
      color: white;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: 0 4px 16px var(--shadow);
      transition: all 0.25s ease;
      animation: slideIn 0.3s ease;
      position: relative;
    }

    .task-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      border-radius: var(--radius-md) 0 0 var(--radius-md);
      transition: all 0.2s ease;
    }

    .task-item.priority-high::before {
      background: var(--priority-high);
    }

    .task-item.priority-medium::before {
      background: var(--priority-medium);
    }

    .task-item.priority-low::before {
      background: var(--priority-low);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-item.removing {
      animation: slideOut 0.25s ease forwards;
    }

    @keyframes slideOut {
      to {
        opacity: 0;
        transform: translateX(-30px);
      }
    }

    .task-item:hover {
      background: rgba(255, 255, 255, 0.85);
    }

    .checkbox {
      position: relative;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .checkbox input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      z-index: 1;
    }

    .checkmark {
      position: absolute;
      top: 0;
      left: 0;
      width: 24px;
      height: 24px;
      background: var(--surface-solid);
      border: 2px solid var(--primary-light);
      border-radius: 6px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkmark::after {
      content: '';
      width: 10px;
      height: 10px;
      background: var(--primary);
      border-radius: 3px;
      transform: scale(0);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .checkbox input:checked + .checkmark {
      background: var(--primary-lighter);
      border-color: var(--primary);
    }

    .checkbox input:focus-visible + .checkmark {
      box-shadow: 0 0 0 3px rgba(252, 211, 77, 0.4);
    }

    .checkbox input:checked + .checkmark::after {
      transform: scale(1);
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 1rem;
      color: var(--text-primary);
      transition: all 0.2s ease;
      word-break: break-word;
      display: block;
    }

    .task-item.completed .task-text {
      color: var(--text-light);
      text-decoration: line-through;
      text-decoration-color: var(--primary-light);
    }

    .task-text-input {
      width: 100%;
      padding: 8px 12px;
      border: 2px solid var(--primary-light);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
      background: var(--surface-solid);
      color: var(--text-primary);
      outline: none;
    }

    .edit-priority-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .edit-priority-btn {
      padding: 4px 12px;
      border: 1px solid;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      background: transparent;
    }

    .edit-priority-btn.high {
      color: var(--priority-high);
      border-color: var(--priority-high);
    }
    .edit-priority-btn.high:hover, .edit-priority-btn.high.active {
      background: var(--priority-high-bg);
    }

    .edit-priority-btn.medium {
      color: var(--priority-medium);
      border-color: var(--priority-medium);
    }
    .edit-priority-btn.medium:hover, .edit-priority-btn.medium.active {
      background: var(--priority-medium-bg);
    }

    .edit-priority-btn.low {
      color: var(--priority-low);
      border-color: var(--priority-low);
    }
    .edit-priority-btn.low:hover, .edit-priority-btn.low.active {
      background: var(--priority-low-bg);
    }

    .task-due {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .task-due.overdue {
      color: var(--danger);
    }

    .task-due.soon {
      color: var(--priority-medium);
    }

    .task-due svg {
      width: 12px;
      height: 12px;
    }

    .due-input-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }

    .due-select {
      padding: 6px 10px;
      border: 1px solid var(--text-light);
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-family: inherit;
      background: var(--surface-solid);
      color: var(--text-primary);
      outline: none;
      cursor: pointer;
    }

    .due-select:focus {
      border-color: var(--primary);
    }

    .edit-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .edit-row svg {
      width: 14px;
      height: 14px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .edit-row .priority-btns {
      display: flex;
      gap: 4px;
    }

    .edit-due-select {
      padding: 6px 10px;
      border: 1px solid var(--text-light);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-family: inherit;
      background: var(--surface-solid);
      color: var(--text-primary);
      outline: none;
      cursor: pointer;
    }

    .edit-confirm-btn {
      padding: 8px 16px;
      background: var(--text-primary);
      color: var(--bg-gradient-end);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-left: auto;
    }

    .edit-confirm-btn:hover {
      opacity: 0.9;
    }

    .clear-due-btn {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .task-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .edit-btn, .delete-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-light);
    }

    .edit-btn:hover {
      background: var(--primary-lighter);
      color: var(--primary);
    }

    .delete-btn:hover {
      background: var(--danger-light);
      color: var(--danger);
    }

    .edit-btn svg, .delete-btn svg {
      width: 18px;
      height: 18px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 32px var(--shadow);
    }

    .empty-state-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--primary-lighter) 0%, var(--primary-light) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .empty-state-icon svg {
      width: 40px;
      height: 40px;
      color: var(--primary);
    }

    .empty-state h3 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--surface-solid);
      border-radius: var(--radius-lg);
      padding: 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      transform: scale(0.9);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: var(--danger-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-icon svg {
      width: 32px;
      height: 32px;
      color: var(--danger);
    }

    .modal h3 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .modal p {
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .modal-btns {
      display: flex;
      gap: 12px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-btn.cancel {
      background: var(--surface);
      border: 1px solid var(--text-light);
      color: var(--text-secondary);
    }

    .modal-btn.cancel:hover {
      background: #f5f5f5;
    }

    .modal-btn.confirm {
      background: var(--danger);
      border: none;
      color: white;
    }

    .modal-btn.confirm:hover {
      background: #b91c1c;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 16px;
      }

      h1 {
        font-size: 2rem;
      }

      .input-row {
        flex-direction: column;
      }

      .btn-row {
        flex-direction: column;
      }

      .stats-bar {
        flex-direction: row;
      }

      .stat-card {
        padding: 14px 12px;
      }

      .stat-number {
        font-size: 1.75rem;
      }

      .priority-row {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>待办事项</h1>
    </header>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-number pending" id="pendingCount">0</div>
        <div class="stat-label">待完成</div>
      </div>
      <div class="stat-card">
        <div class="stat-number done" id="doneCount">0</div>
        <div class="stat-label">已完成</div>
      </div>
    </div>

    <div class="input-section">
      <div class="input-row">
        <input
          type="text"
          class="task-input"
          id="taskInput"
          placeholder="今天要做什么"
          autocomplete="off"
        >
      </div>
      <div class="add-options-row">
        <div class="priority-row">
          <span class="priority-label">优先级：</span>
          <button class="priority-btn high" data-priority="high">高</button>
          <button class="priority-btn medium active" data-priority="medium">中</button>
          <button class="priority-btn low" data-priority="low">低</button>
        </div>
        <div class="due-input-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;color:var(--text-secondary);flex-shrink:0"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <select class="due-select" id="dueSelect">
            <option value="0.5">30分钟后</option>
            <option value="1" selected>1小时后</option>
            <option value="2">2小时后</option>
            <option value="3">3小时后</option>
            <option value="4">4小时后</option>
            <option value="5">5小时后</option>
            <option value="6">6小时后</option>
            <option value="8">8小时后</option>
            <option value="12">12小时后</option>
          </select>
        </div>
      </div>
      <div class="btn-row">
        <button class="add-btn" id="addBtn">添加任务</button>
        <button class="clear-btn" id="clearBtn">清空全部</button>
      </div>
    </div>

    <div class="task-list" id="taskList"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </div>
      <h3>确认清空</h3>
      <p>确定要删除所有任务吗？此操作不可撤销。</p>
      <div class="modal-btns">
        <button class="modal-btn cancel" id="modalCancel">取消</button>
        <button class="modal-btn confirm" id="modalConfirm">确认删除</button>
      </div>
    </div>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const clearBtn = document.getElementById('clearBtn');
    const taskList = document.getElementById('taskList');
    const pendingCount = document.getElementById('pendingCount');
    const doneCount = document.getElementById('doneCount');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalCancel = document.getElementById('modalCancel');
    const modalConfirm = document.getElementById('modalConfirm');
    const priorityBtns = document.querySelectorAll('.priority-btn');
    const dueSelect = document.getElementById('dueSelect');

    const STORAGE_KEY = 'todo-app-tasks';

    let tasks = [];
    let currentPriority = 'medium';
    let currentEditingId = null;

    function loadTasks() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          tasks = JSON.parse(stored);
        } catch (e) {
          tasks = [];
        }
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function updateStats() {
      const pending = tasks.filter(t => !t.completed).length;
      const done = tasks.filter(t => t.completed).length;
      pendingCount.textContent = pending;
      doneCount.textContent = done;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDueDate(dueDate) {
      const now = new Date();
      const due = new Date(dueDate);
      const diff = due - now;
      const hours = Math.floor(diff / (1000 * 60 * 60));
      const days = Math.floor(hours / 24);

      const dateStr = due.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
      const timeStr = due.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

      if (diff < 0) {
        return { text: `已逾期 ${Math.abs(hours)} 小时`, status: 'overdue' };
      } else if (hours <= 24) {
        return { text: `${hours} 小时后`, status: 'soon' };
      } else if (days <= 7) {
        return { text: `${days} 天后`, status: 'normal' };
      } else {
        return { text: `${dateStr}`, status: 'normal' };
      }
    }

    function createTaskElement(task) {
      const div = document.createElement('div');
      div.className = `task-item priority-${task.priority}${task.completed ? ' completed' : ''}`;
      div.dataset.id = task.id;

      const editIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
      const deleteIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>`;
      const clockIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;

      let dueDateHtml = '';
      if (task.dueDate) {
        const dueInfo = formatDueDate(task.dueDate);
        dueDateHtml = `<div class="task-due ${dueInfo.status}">${clockIcon}<span>${dueInfo.text}</span></div>`;
      }

      div.innerHTML = `
        <label class="checkbox">
          <input type="checkbox" ${task.completed ? 'checked' : ''}>
          <span class="checkmark"></span>
        </label>
        <div class="task-content">
          <span class="task-text">${escapeHtml(task.text)}</span>
          ${dueDateHtml}
        </div>
        <div class="task-actions">
          <button class="edit-btn" title="编辑">
            ${editIcon}
          </button>
          <button class="delete-btn" title="删除">
            ${deleteIcon}
          </button>
        </div>
      `;

      const checkbox = div.querySelector('input[type="checkbox"]');
      checkbox.addEventListener('change', () => toggleTask(task.id));

      const editBtn = div.querySelector('.edit-btn');
      editBtn.addEventListener('click', () => startEditTask(task.id));

      const deleteBtn = div.querySelector('.delete-btn');
      deleteBtn.addEventListener('click', () => deleteTask(task.id));

      return div;
    }

    function renderTasks() {
      taskList.innerHTML = '';

      if (tasks.length === 0) {
        taskList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
                <path d="M20 10a8 8 0 0 0-8-8v8h8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </div>
            <h3>时间像阳光一样珍贵</h3>
            <p>列下今天的计划，<br>让每一刻都更有意义。</p>
          </div>
        `;
        return;
      }

      const priorityOrder = { high: 0, medium: 1, low: 2 };
      const incompleteTasks = [...tasks.filter(t => !t.completed)].sort((a, b) => {
        return priorityOrder[a.priority] - priorityOrder[b.priority];
      });
      const completeTasks = [...tasks.filter(t => t.completed)].sort((a, b) => {
        return priorityOrder[a.priority] - priorityOrder[b.priority];
      });
      const sortedTasks = [...incompleteTasks, ...completeTasks];

      sortedTasks.forEach(task => {
        taskList.appendChild(createTaskElement(task));
      });
    }

    function startEditTask(id) {
      currentEditingId = id;
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const taskItem = document.querySelector(`.task-item[data-id="${id}"]`);
      const taskContent = taskItem.querySelector('.task-content');
      const clockIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;

      const getHoursFromDue = (dueDate) => {
        if (!dueDate) return 1;
        const diff = new Date(dueDate) - Date.now();
        const hours = diff / (1000 * 60 * 60);
        if (hours < 0.5) return 0.5;
        if (hours > 12) return 12;
        return Math.round(hours);
      };
      const currentHours = getHoursFromDue(task.dueDate);

      taskContent.innerHTML = `
        <input type="text" class="task-text-input" value="${escapeHtml(task.text)}">
        <div class="edit-row">
          <div class="priority-btns">
            <button class="edit-priority-btn high${task.priority === 'high' ? ' active' : ''}" data-priority="high">高</button>
            <button class="edit-priority-btn medium${task.priority === 'medium' ? ' active' : ''}" data-priority="medium">中</button>
            <button class="edit-priority-btn low${task.priority === 'low' ? ' active' : ''}" data-priority="low">低</button>
          </div>
          ${clockIcon}
          <select class="edit-due-select" id="editDueSelect">
            <option value="0.5" ${currentHours === 0.5 ? 'selected' : ''}>30分钟后</option>
            <option value="1" ${currentHours === 1 ? 'selected' : ''}>1小时后</option>
            <option value="2" ${currentHours === 2 ? 'selected' : ''}>2小时后</option>
            <option value="3" ${currentHours === 3 ? 'selected' : ''}>3小时后</option>
            <option value="4" ${currentHours === 4 ? 'selected' : ''}>4小时后</option>
            <option value="5" ${currentHours === 5 ? 'selected' : ''}>5小时后</option>
            <option value="6" ${currentHours === 6 ? 'selected' : ''}>6小时后</option>
            <option value="8" ${currentHours === 8 ? 'selected' : ''}>8小时后</option>
            <option value="12" ${currentHours === 12 ? 'selected' : ''}>12小时后</option>
          </select>
          <button class="edit-confirm-btn" id="editConfirmBtn">确认</button>
        </div>
      `;

      const input = taskContent.querySelector('input');
      const priorityBtns = taskContent.querySelectorAll('.edit-priority-btn');
      const editDueSelect = taskContent.querySelector('#editDueSelect');
      const confirmBtn = taskContent.querySelector('#editConfirmBtn');
      input.focus();
      input.select();

      priorityBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          priorityBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          task.priority = btn.dataset.priority;
          taskItem.className = `task-item priority-${task.priority}${task.completed ? ' completed' : ''}`;
        });
      });

      const finishEdit = () => {
        if (currentEditingId !== id) return;
        currentEditingId = null;
        const newText = input.value.trim();
        if (newText && newText !== task.text) {
          task.text = newText;
        }
        const hours = parseFloat(editDueSelect.value);
        task.dueDate = new Date(Date.now() + hours * 60 * 60 * 1000).toISOString();
        saveTasks();
        renderTasks();
      };

      confirmBtn.addEventListener('click', finishEdit);

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          finishEdit();
        }
        if (e.key === 'Escape') {
          currentEditingId = null;
          renderTasks();
        }
      });
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) {
        taskInput.classList.add('shake');
        setTimeout(() => taskInput.classList.remove('shake'), 400);
        taskInput.focus();
        return;
      }

      const hours = parseFloat(dueSelect.value);
      const dueDate = new Date(Date.now() + hours * 60 * 60 * 1000).toISOString();

      const task = {
        id: Date.now().toString(),
        text,
        priority: currentPriority,
        completed: false,
        createdAt: new Date().toISOString(),
        dueDate
      };

      tasks.unshift(task);
      saveTasks();
      renderTasks();
      updateStats();

      taskInput.value = '';
      taskInput.focus();
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        renderTasks();
        updateStats();
      }
    }

    function deleteTask(id) {
      const taskEl = document.querySelector(`.task-item[data-id="${id}"]`);
      if (taskEl) {
        taskEl.classList.add('removing');
        setTimeout(() => {
          tasks = tasks.filter(t => t.id !== id);
          saveTasks();
          renderTasks();
          updateStats();
        }, 250);
      }
    }

    function showClearModal() {
      if (tasks.length === 0) return;
      modalOverlay.classList.add('active');
    }

    function hideClearModal() {
      modalOverlay.classList.remove('active');
    }

    function clearAllTasks() {
      tasks = [];
      saveTasks();
      renderTasks();
      updateStats();
      hideClearModal();
    }

    priorityBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        priorityBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPriority = btn.dataset.priority;
      });
    });

    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    addBtn.addEventListener('click', addTask);
    clearBtn.addEventListener('click', showClearModal);
    modalCancel.addEventListener('click', hideClearModal);
    modalConfirm.addEventListener('click', clearAllTasks);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) hideClearModal();
    });

    loadTasks();
    renderTasks();
    updateStats();
  </script>
</body>
</html>
